<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proxy Creator</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #ffffff;
      }

      #boot-status {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .boot-card {
        max-width: 720px;
        padding: 24px;
        border: 2px solid #000000;
        background: #ffffff;
        color: #111111;
        line-height: 1.6;
      }

      .boot-card h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }

      .boot-card p {
        margin: 0 0 12px;
      }

      .boot-card code {
        background: #f4f4f4;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <div id="boot-status">
      <div class="boot-card">
        <h1>Loading app...</h1>
        <p>If this message stays on screen, the project is probably being opened directly instead of running through the React dev server.</p>
        <p>Run <code>npm install</code> and then <code>npm start</code> in this folder.</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
