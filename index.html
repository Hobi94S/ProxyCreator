<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proxy Creator</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #ffffff;
      }

      #boot-status {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .boot-card {
        max-width: 720px;
        padding: 24px;
        border: 2px solid #000000;
        background: #ffffff;
        color: #111111;
        line-height: 1.6;
      }

      .boot-card h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }

      .boot-card p {
        margin: 0 0 12px;
      }

      .boot-card code {
        background: #f4f4f4;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <div id="boot-status">
      <div class="boot-card">
        <h1>ProxyCreator Dev Boot</h1>
        <p>If this screen stays visible, the browser did not finish loading the React entry module.</p>
        <p>Expected dev entry: <code>/src/main.jsx</code></p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module">
      import('/src/main.jsx').catch((error) => {
        console.error('Failed to load /src/main.jsx', error);

        const bootStatus = document.getElementById('boot-status');

        if (!bootStatus) {
          return;
        }

        const heading = bootStatus.querySelector('h1');
        const paragraphs = bootStatus.querySelectorAll('p');

        if (heading) {
          heading.textContent = 'App failed to load entry module';
        }

        if (paragraphs[0]) {
          paragraphs[0].textContent =
            error instanceof Error ? error.message : 'Unknown module loading error.';
        }

        if (paragraphs[1]) {
          paragraphs[1].textContent = 'Open the browser console and Network tab for the failing request.';
        }
      });
    </script>
  </body>
</html>
