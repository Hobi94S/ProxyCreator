<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Card Standard Creator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&family=Zen+Maru+Gothic:wght@400;700;900&display=swap');
        
        :root {
            --manga-black: #000000;
            --manga-white: #FFFFFF;
            --manga-red: #DC143C;
            --manga-gray: #E8E8E8;
            --manga-dark-gray: #2A2A2A;
            --manga-panel-bg: #F5F5F5;
            --text-primary: #000000;
            --text-secondary: #333333;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans JP', 'Zen Maru Gothic', sans-serif;
            background: var(--manga-white);
            background-image: 
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.02) 2px,
                    rgba(0, 0, 0, 0.02) 4px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.02) 2px,
                    rgba(0, 0, 0, 0.02) 4px
                );
            margin: 0;
            padding: 0;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            line-height: 1.8;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 10px,
                    rgba(0, 0, 0, 0.03) 10px,
                    rgba(0, 0, 0, 0.03) 20px
                ),
                repeating-linear-gradient(
                    -45deg,
                    transparent,
                    transparent 10px,
                    rgba(0, 0, 0, 0.03) 10px,
                    rgba(0, 0, 0, 0.03) 20px
                );
            pointer-events: none;
            z-index: 0;
            opacity: 0.3;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background: var(--manga-white);
            padding: 30px 20px;
            border: 3px solid var(--manga-black);
            box-shadow: 
                0 0 0 2px var(--manga-white),
                0 0 0 5px var(--manga-black);
            position: relative;
            background-image: 
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 5px,
                    rgba(0, 0, 0, 0.02) 5px,
                    rgba(0, 0, 0, 0.02) 10px
                );
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 3px;
            background: var(--manga-black);
        }

        h1 {
            margin: 0 0 15px 0;
            color: var(--manga-black);
            font-family: 'Noto Serif JP', serif;
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
        }

        header p {
            color: var(--text-secondary);
            margin-top: 10px;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .controls-panel {
            background: var(--manga-white);
            border: 3px solid var(--manga-black);
            padding: 25px;
            margin-bottom: 30px;
            position: relative;
            box-shadow: 
                0 0 0 2px var(--manga-white),
                0 0 0 5px var(--manga-black);
        }

        .controls-panel::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 20px;
            background: var(--manga-white);
            padding: 5px 15px;
            font-family: 'Noto Serif JP', serif;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 2px;
            border: 2px solid var(--manga-black);
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .btn {
            padding: 18px 24px;
            border: 3px solid var(--manga-black);
            border-radius: 0;
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 700;
            cursor: pointer;
            font-size: 16px;
            color: var(--manga-black);
            transition: all 0.2s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: var(--manga-white);
            text-transform: uppercase;
            letter-spacing: 1px;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--manga-black);
            transition: left 0.3s ease;
            z-index: 0;
        }

        .btn:hover::before {
            left: 0;
        }

        .btn span {
            position: relative;
            z-index: 1;
            transition: color 0.3s ease;
        }

        .btn:hover span {
            color: var(--manga-white);
        }

        .btn:hover {
            transform: translateX(3px) translateY(-3px);
            box-shadow: 
                -3px 3px 0px 0px var(--manga-black),
                -6px 6px 0px 0px var(--manga-gray);
        }

        .btn:active {
            transform: translateX(1px) translateY(-1px);
            box-shadow: 
                -1px 1px 0px 0px var(--manga-black);
        }

        .btn-upload {
            background: var(--manga-white);
        }

        .btn-upload:hover {
            background: var(--manga-black);
        }

        .btn-generate {
            background: var(--manga-white);
        }

        .btn-generate:hover {
            background: var(--manga-black);
        }

        .btn-clear {
            background: var(--manga-white);
        }

        .btn-clear:hover {
            background: var(--manga-red);
            border-color: var(--manga-red);
        }

        .btn-clear:hover span {
            color: var(--manga-white);
        }

        .btn-github {
            background: var(--manga-dark-gray);
            color: var(--manga-white);
            border-color: var(--manga-dark-gray);
        }

        .btn-github:hover {
            background: var(--manga-black);
            border-color: var(--manga-black);
        }

        .btn-github span {
            color: var(--manga-white);
        }

        #file-input {
            display: none;
        }

        #loading {
            display: none;
            text-align: center;
            font-weight: 700;
            font-family: 'Noto Sans JP', sans-serif;
            color: var(--manga-black);
            margin: 20px;
            padding: 20px;
            background: var(--manga-white);
            border: 3px solid var(--manga-black);
            position: relative;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #loading::before {
            content: '';
            display: block;
            font-size: 0.9rem;
            margin-bottom: 10px;
            color: var(--manga-red);
        }

        .stats {
            text-align: center;
            margin-bottom: 25px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Noto Sans JP', sans-serif;
            color: var(--manga-black);
            padding: 18px 25px;
            background: var(--manga-white);
            border: 3px solid var(--manga-black);
            position: relative;
            letter-spacing: 1px;
            box-shadow: 
                0 0 0 2px var(--manga-white),
                0 0 0 5px var(--manga-black);
        }

        .stats::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 20px;
            background: var(--manga-white);
            padding: 3px 10px;
            font-size: 0.85rem;
            border: 2px solid var(--manga-black);
            letter-spacing: 1px;
        }

        #preview-area {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .card-preview {
            background: var(--manga-white);
            padding: 15px;
            border: 3px solid var(--manga-black);
            box-shadow: 
                0 0 0 2px var(--manga-white),
                0 0 0 5px var(--manga-black);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: all 0.2s ease;
            background-image: 
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 3px,
                    rgba(0, 0, 0, 0.02) 3px,
                    rgba(0, 0, 0, 0.02) 6px
                );
        }

        .card-preview:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 0 0 2px var(--manga-white),
                0 0 0 5px var(--manga-black),
                0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .card-order {
            position: absolute;
            top: -12px;
            left: 15px;
            background: var(--manga-red);
            color: var(--manga-white);
            padding: 4px 12px;
            border: 2px solid var(--manga-black);
            font-family: 'Noto Serif JP', serif;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1px;
            z-index: 1;
            box-shadow: 2px 2px 0px 0px var(--manga-black);
        }

        .card-preview img {
            width: 150px;
            height: auto;
            border: 2px solid var(--manga-black);
            margin-bottom: 15px;
            transition: transform 0.2s ease;
            background: var(--manga-white);
            box-shadow: 3px 3px 0px 0px var(--manga-black);
        }

        .card-preview:hover img {
            transform: scale(1.05);
        }

        .card-controls {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 2px solid var(--manga-black);
        }

        .card-controls label {
            font-size: 13px;
            font-weight: 700;
            font-family: 'Noto Sans JP', sans-serif;
            color: var(--manga-black);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        .qty-input {
            width: 60px;
            text-align: center;
            padding: 6px 8px;
            border: 2px solid var(--manga-black);
            border-radius: 0;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Noto Sans JP', sans-serif;
            transition: all 0.2s ease;
            background: var(--manga-white);
            color: var(--manga-black);
        }

        .qty-input:focus {
            outline: none;
            border-color: var(--manga-red);
            box-shadow: 
                0 0 0 2px var(--manga-white),
                0 0 0 4px var(--manga-red);
        }

        .remove-btn {
            background: var(--manga-white);
            border: 2px solid var(--manga-black);
            color: var(--manga-black);
            cursor: pointer;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            font-family: 'Noto Sans JP', sans-serif;
            padding: 6px 12px;
            border-radius: 0;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }

        .remove-btn:hover {
            background: var(--manga-red);
            color: var(--manga-white);
            border-color: var(--manga-red);
            transform: translateX(2px) translateY(-2px);
            box-shadow: -2px 2px 0px 0px var(--manga-black);
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            margin-top: auto;
            background: var(--manga-white);
            border-top: 3px solid var(--manga-black);
            color: var(--manga-black);
            position: relative;
            z-index: 1;
        }

        footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: repeating-linear-gradient(
                90deg,
                var(--manga-black) 0px,
                var(--manga-black) 10px,
                var(--manga-white) 10px,
                var(--manga-white) 20px
            );
        }

        .footer-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer-title {
            font-weight: 700;
            font-family: 'Noto Serif JP', serif;
            font-size: 1.2rem;
            color: var(--manga-black);
            letter-spacing: 2px;
            position: relative;
            padding-bottom: 10px;
        }

        .footer-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 2px;
            background: var(--manga-red);
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px 10px;
            }

            h1 {
                font-size: 2rem;
                letter-spacing: 2px;
            }

            header {
                padding: 25px 15px;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .btn {
                width: 100%;
            }

            #preview-area {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .controls-panel::before {
                font-size: 0.8rem;
                padding: 3px 10px;
            }
        }

        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Proxy Card Standard Creator</h1>
        <p>A4 Landscape | Cut spacing (4mm) | Cut guides</p>
    </header>

    <div class="controls-panel">
        <div class="controls">
            <button class="btn btn-upload" onclick="document.getElementById('file-input').click()"><span>+ Add Cards</span></button>
            <button class="btn btn-generate" onclick="generatePDF()"><span>Download PDF</span></button>
            <button class="btn btn-clear" onclick="clearAll()"><span>Clear All</span></button>
            <input type="file" id="file-input" multiple accept="image/*" onchange="handleFiles(this.files)">
        </div>
    </div>

    <div id="loading">Loading images in order...</div>
    <div class="stats" id="stats-info">Total cards: 0 | Estimated sheets: 0</div>

    <div id="preview-area"></div>
</div>

<footer>
    <div class="footer-content">
        <span class="footer-title">Created by Hobi94S</span>
        <a href="https://github.com/Hobi94S" target="_blank" class="btn btn-github">
            <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor" style="margin-right: 8px; position: relative; z-index: 1;">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
            </svg>
            <span>Access Github</span>
        </a>
    </div>
</footer>

<script>
    const { jsPDF } = window.jspdf;
    let cardDataList = [];

    const CARD_WIDTH = 63;
    const CARD_HEIGHT = 88;
    const PAGE_WIDTH = 297;
    const PAGE_HEIGHT = 210;
    
    const COLS = 4;
    const ROWS = 2;
    const CARDS_PER_PAGE = COLS * ROWS;
    const GAP = 4;
    const readFileAsPromise = (file) => {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve({
                id: Math.random().toString(36).substr(2, 9),
                src: e.target.result,
                qty: 1,
                name: file.name
            });
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    };

    async function handleFiles(files) {
        if (!files.length) return;
        document.getElementById('loading').style.display = 'block';

        try {
            const promises = Array.from(files).map(file => readFileAsPromise(file));
            const newCards = await Promise.all(promises);
            
            newCards.forEach(card => {
                cardDataList.push(card);
                renderCard(card);
            });
            updateStats();
        } catch (error) {
            alert("Error loading images.");
        } finally {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('file-input').value = '';
        }
    }

    function renderCard(card) {
        const container = document.getElementById('preview-area');
        const index = cardDataList.indexOf(card) + 1; 
        
        const div = document.createElement('div');
        div.className = 'card-preview';
        div.id = `card-${card.id}`;
        div.innerHTML = `
            <span class="card-order">#${index}</span>
            <img src="${card.src}" alt="${card.name}">
            <div class="card-controls">
                <label>Qty: <input type="number" min="1" value="${card.qty}" class="qty-input" onchange="updateQty('${card.id}', this.value)"></label>
                <button class="remove-btn" onclick="removeCard('${card.id}')">Remove</button>
            </div>
        `;
        container.appendChild(div);
    }

    function updateQty(id, value) {
        const card = cardDataList.find(c => c.id === id);
        if (card) { card.qty = parseInt(value); updateStats(); }
    }

    function removeCard(id) {
        cardDataList = cardDataList.filter(c => c.id !== id);
        document.getElementById(`card-${id}`).remove();
        refreshIndices();
        updateStats();
    }

    function refreshIndices() {
        document.querySelectorAll('.card-preview').forEach((div, i) => {
             div.querySelector('.card-order').innerText = `#${i + 1}`;
        });
    }

    function clearAll() {
        cardDataList = [];
        document.getElementById('preview-area').innerHTML = '';
        updateStats();
    }

    function updateStats() {
        const total = cardDataList.reduce((sum, c) => sum + c.qty, 0);
        const pages = Math.ceil(total / CARDS_PER_PAGE);
        document.getElementById('stats-info').innerText = `Total cards: ${total} | A4 sheets needed: ${pages}`;
    }

    async function generatePDF() {
        if (cardDataList.length === 0) return alert("Add cards!");

        const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

        const totalGridWidth = (COLS * CARD_WIDTH) + ((COLS - 1) * GAP);
        const totalGridHeight = (ROWS * CARD_HEIGHT) + ((ROWS - 1) * GAP);
        
        const startX = (PAGE_WIDTH - totalGridWidth) / 2;
        const startY = (PAGE_HEIGHT - totalGridHeight) / 2;

        let printQueue = [];
        cardDataList.forEach(card => {
            for (let i = 0; i < card.qty; i++) printQueue.push(card.src);
        });

        let idx = 0;
        while (idx < printQueue.length) {
            if (idx > 0 && idx % CARDS_PER_PAGE === 0) doc.addPage();

            const pos = idx % CARDS_PER_PAGE;
            const col = pos % COLS;
            const row = Math.floor(pos / COLS);

            const x = startX + (col * (CARD_WIDTH + GAP));
            const y = startY + (row * (CARD_HEIGHT + GAP));

            doc.addImage(printQueue[idx], 'JPEG', x, y, CARD_WIDTH, CARD_HEIGHT);

            doc.setDrawColor(150, 150, 150);
            doc.setLineWidth(0.1);
            doc.setLineDash([1, 1], 0); 

            if (col < COLS - 1) {
                const guideX = x + CARD_WIDTH + (GAP / 2);
                doc.line(guideX, y, guideX, y + CARD_HEIGHT); 
            }

            if (row < ROWS - 1) {
                const guideY = y + CARD_HEIGHT + (GAP / 2);
                doc.line(x, guideY, x + CARD_WIDTH, guideY);
            }

            idx++;
        }

        doc.save('one-piece-proxies-hobi94s.pdf');
    }
</script>

</body>
</html>
